services:
  jellyfin:
    container_name: "jellyfin"
    image: "jellyfin/jellyfin"
    restart: "unless-stopped"
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    volumes:
      - "./config:/config"
      - "./cache:/cache"
      - type: "bind"
        source: "/home/b3col3/Vidéos/"
        target: "/media"
        read_only: true
    networks:
      - "proxy"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.traefik.me`)"
      - "traefik.http.routers.jellyfin.entrypoints=web"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

networks:
  proxy:
    external: true
