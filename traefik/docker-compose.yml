services:
  traefik:
    container_name: "traefik"
    image: "traefik:latest"
    restart: "unless-stopped"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
    networks:
      - "proxy"

networks:
  proxy:
    external: true
